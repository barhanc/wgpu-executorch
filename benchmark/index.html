<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebGPU FP16 vs FP32 Browser Benchmark</title>
  <style>
    body {
      font-family: monospace;
      background: #111;
      color: #eee;
      padding: 24px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #222;
      color: #61afef;
    }
    .speedup {
      font-weight: bold;
      color: #98c379;
    }
    #status {
      font-size: 1.1em;
      color: #e5c07b;
      margin-bottom: 16px;
    }
    #json-output {
      display: none;
    }
  </style>
</head>
<body>
  <h1>WebGPU Browser Hardware Benchmark (FP32 vs FP16)</h1>
  <div id="status">Initializing WebGPU...</div>
  <div id="info"></div>
  <table id="results-table" style="display:none;">
    <thead>
      <tr>
        <th>Category</th>
        <th>Operator / Kernel</th>
        <th>Tensor Shape</th>
        <th>FP32 (ms)</th>
        <th>FP16 (ms)</th>
        <th>Speedup</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
  <pre id="json-output"></pre>
  <script type="module" src="/main.ts"></script>
</body>
</html>
