<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wgpu inference — demos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Gallery: a tile per demo task -->
    <template id="gallery-template">
      <main>
        <header>
          <h1>wgpu inference</h1>
          <p class="tagline">demo gallery</p>
        </header>

        <div class="stage">
          <div class="tiles"></div>
        </div>
      </main>
    </template>

    <!-- Task page: camera viewport shared by every demo -->
    <template id="task-template">
      <main>
        <header>
          <h1>wgpu inference</h1>
          <p class="tagline"></p>
        </header>

        <a class="back" href="#/">← all demos</a>

        <div class="stage">
          <div class="viewport">
            <div class="viewport-inner">
              <video autoplay playsinline muted></video>
              <canvas></canvas>
              <div class="status">
                <span class="status-dot"></span>
                <span class="status-text">camera offline</span>
              </div>
              <div class="metrics">
                <div class="metrics-values"></div>
                <div class="metrics-tip" role="tooltip"></div>
              </div>
            </div>
          </div>

          <button class="action" type="button" aria-label="Start camera">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2.5" y="6" width="13" height="12" rx="2.5" />
              <path d="M15.5 9.5L21.5 6.5v11l-6-3" />
            </svg>
          </button>

          <aside class="panel-info">
            <div class="panel-inner">
              <h2 class="panel-title"></h2>
              <div class="panel-text">
                <p class="panel-description"></p>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
