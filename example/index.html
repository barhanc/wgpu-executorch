<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU ExecuTorch Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Gallery: a tile per demo task -->
    <template id="gallery-template">
      <main>
        <div class="stage">
          <div class="tiles"></div>
        </div>
      </main>
    </template>

    <!-- Task page: camera viewport shared by every demo -->
    <template id="task-template">
      <main>
        <div class="topbar">
          <a class="back" href="#/">← all demos</a>
          <h2 class="task-title"></h2>
          <div class="precision-control">
            <span class="precision-label">Precision</span>
            <label class="precision-switch">
              <input
                class="precision-toggle"
                type="checkbox"
                role="switch"
                aria-label="Use FP16 precision"
                disabled
              />
              <span class="precision-track" aria-hidden="true">
                <span>FP32</span>
                <span>FP16</span>
              </span>
            </label>
          </div>
        </div>

        <div class="stage">
          <div class="viewport">
            <div class="viewport-inner">
              <video autoplay playsinline muted></video>
              <canvas></canvas>
              <div class="status">
                <span class="status-dot"></span>
                <span class="status-text">camera offline</span>
              </div>
              <div class="metrics">
                <div class="metrics-values"></div>
                <div class="metrics-tip" role="tooltip"></div>
              </div>
            </div>
          </div>

          <button class="action" type="button" aria-label="Start camera">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="2.5" y="6" width="13" height="12" rx="2.5" />
              <path d="M15.5 9.5L21.5 6.5v11l-6-3" />
            </svg>
          </button>
        </div>
      </main>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
